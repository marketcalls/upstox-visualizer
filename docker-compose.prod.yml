# Production stack: nginx terminates TLS and enforces basic auth, certbot keeps
# the Let's Encrypt certificate alive, and the app runs with no published port
# at all, reachable only across the internal network.
#
# First deployment needs the certificate issued before nginx can start. See the
# "Deploy to a server" section of README.md, or run deploy/bootstrap-tls.sh.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Deliberately a separate file rather than an override, so the loopback-only
# docker-compose.yml keeps working untouched for local runs.

name: upstox-prod

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: upstox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      # Restrict envsubst to the APP_ prefix, otherwise it would eat nginx's
      # own $host, $scheme and $request_uri while rendering the template.
      NGINX_ENVSUBST_FILTER: "APP_"
    volumes:
      - ./deploy/nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      # Generated on the server by deploy/bootstrap-tls.sh, never committed.
      - ./deploy/htpasswd:/etc/nginx/.htpasswd:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    # Pick up renewed certificates without a restart. nginx only re-reads a
    # certificate on reload, so without this a renewal is invisible until the
    # container bounces and the cert eventually expires in place.
    command: sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    container_name: upstox-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renewal only. Issuance is the bootstrap step, because nginx cannot start
    # without a certificate and certbot cannot use the webroot without nginx.
    # certbot exits early unless the cert is within 30 days of expiry, so a
    # twice-daily attempt is cheap and is what Let's Encrypt recommends.
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: upstox-visualizer:latest
    container_name: upstox-app
    restart: unless-stopped

    # No ports. The only route in is through nginx, which is what enforces the
    # password. Publishing a port here would bypass authentication entirely.
    expose:
      - "8000"

    environment:
      # The origin the browser reaches. Drives the redirect URL suggested on the
      # setup screen and the origin the OAuth callback is allowed to return to.
      # Must match the URL registered on the Upstox developer app exactly.
      UPSTOX_PUBLIC_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
      TZ: ${TZ:-Asia/Kolkata}

    volumes:
      # Credentials, the OAuth token, the instrument master and the candle
      # cache. The only writable path the container has.
      - upstox-data:/app/data

    # The app writes nothing outside /app/data, so the rest of the filesystem
    # is sealed. Verified: no tempfile use, no logging to disk, and the venv is
    # byte-compiled at build time.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          # Headroom for the instrument master download, which parses ~124k
          # rows in memory and rebuilds the table in one transaction.
          cpus: "1.5"
          memory: 768M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  upstox-data:
  letsencrypt:
  certbot-webroot:
