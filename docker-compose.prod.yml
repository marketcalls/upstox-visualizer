# Production stack: Caddy terminates TLS and enforces basic auth, the app runs
# with no published port at all and is reachable only across the internal
# network. Copy .env.example to .env and fill it in first.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Deliberately a separate file rather than an override, so the loopback-only
# docker-compose.yml keeps working untouched for local runs.

name: upstox-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: upstox-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      APP_USER: ${APP_USER:?set APP_USER in .env}
      # Escape every $ as $$ in .env or compose will read the bcrypt hash as
      # variable references and pass through a mangled value.
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?set APP_PASSWORD_HASH in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and ACME account keys. Losing this volume means
      # re-issuing on next start, which burns Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Binding 80 and 443 is the only privilege Caddy needs.
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: upstox-visualizer:latest
    container_name: upstox-app
    restart: unless-stopped

    # No ports. The only route in is through Caddy, which is what enforces the
    # password. Publishing a port here would bypass authentication entirely.
    expose:
      - "8000"

    environment:
      # The origin the browser reaches. Drives the redirect URL suggested on the
      # setup screen and the origin the OAuth callback is allowed to return to.
      # Must match the URL registered on the Upstox developer app exactly.
      UPSTOX_PUBLIC_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
      TZ: ${TZ:-Asia/Kolkata}

    volumes:
      # Credentials, the OAuth token, the instrument master and the candle
      # cache. The only writable path the container has.
      - upstox-data:/app/data

    # The app writes nothing outside /app/data, so the rest of the filesystem
    # is sealed. Verified: no tempfile use, no logging to disk, and the venv is
    # byte-compiled at build time.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          # Headroom for the instrument master download, which parses ~124k
          # rows in memory and rebuilds the table in one transaction.
          cpus: "1.5"
          memory: 768M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  upstox-data:
  caddy-data:
  caddy-config:
